name: Source publication checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install verified secret scanner
        run: |
          python packaging/web/install-gitleaks.py --destination "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Verify publication policy and installer
        run: |
          python -m unittest discover -s tests/web -p test_publication_policy.py
          python -m unittest discover -s tests/web -p test_gitleaks_install.py
          python -m unittest discover -s tests/web -p test_upstream_release.py
          python -m unittest discover -s tests/web -p test_publication.py
      - name: Check source and full candidate ancestry
        env:
          PUBLICATION_SOURCE: ${{ github.sha }}
        run: |
          python packaging/web/check-publication.py --ref "$PUBLICATION_SOURCE" --output "$RUNNER_TEMP/publication.json"
