name: Browser and cloud acceptance
on:
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-cloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: tofu-ci-8-core
    # Cold compilation consumes about 32 minutes before the complete browser,
    # collaboration and packaging suites start. Keep the full suite bounded.
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: photocraft_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55438:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      PHOTOCRAFT_FIXTURE: ${{ github.workspace }}/test-results/fixture.pcraft
      PHOTOCRAFT_TEST_ARTIFACTS: ${{ github.workspace }}/test-results/browser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a # 1.95.0
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cloud-browser
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install verified publication scanner
        run: python packaging/web/install-gitleaks.py --destination "$RUNNER_TEMP/gitleaks-bin"
      - name: Expose verified publication scanner
        run: printf '%s\n' "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Check publication ancestry
        env:
          PUBLICATION_SOURCE: ${{ inputs.source_ref || github.sha }}
        run: |
          python packaging/web/check-publication.py --ref "$PUBLICATION_SOURCE" --output "$RUNNER_TEMP/publication.json"
      - name: Install browser dependencies and Trunk
        run: |
          python -m pip install -r tests/web/requirements.txt
          python -m playwright install --with-deps chromium webkit
          cargo install trunk --version 0.21.14 --locked
      - name: Rust adapter checks
        run: |
          python -m unittest discover -s tests/web -p test_upstream_release.py
          python -m unittest discover -s tests/web -p test_publication.py
          python -m unittest discover -s tests/web -p test_gitleaks_install.py
          python -m unittest discover -s tests/web -p test_publication_policy.py
          python -m unittest discover -s tests/web -p test_discovery.py
          python -m unittest discover -s tests/web -p test_benchmark_scale.py
          python -m unittest discover -s tests/web -p test_rust_notices.py
          python -m unittest discover -s tests/web -p test_runtime_notices.py
          python -m unittest discover -s tests/web -p test_build_privacy.py
          python -m unittest discover -s tests/web -p test_container_package.py
          cargo fmt --all -- --check
          cargo test --locked -p photocraft-cloud
          cargo clippy --locked -p photocraft-cloud --all-targets -- -D warnings
          cargo xtask layers
      - name: Build browser engine
        working-directory: apps/photocraft-web
        run: |
          cargo clippy --locked -p photocraft-web --target wasm32-unknown-unknown --no-deps -- -D warnings
          python ../../packaging/web/build-release.py
      - name: Build service and fixture
        run: |
          mkdir -p test-results
          cargo build --locked -p photocraft-cloud
          cargo run --locked -p photocraft-cloud --example fixture -- "$PHOTOCRAFT_FIXTURE"
          python tests/web/test_auth.py
          python tests/web/test_startup.py
      - name: Verify transaction-pool backend switching
        env:
          PUBLIC_DIR: dist/web
        run: |
          python tests/web/probe_transaction_pool.py --binary target/debug/photocraft-cloud --output test-results/transaction-pool.json --expect-success --api-suite --live-suite
      - name: Start disposable service and run acceptance suites
        env:
          DATABASE_URL: postgresql://photocraft_test@127.0.0.1:55438/postgres
          CLOUD_LOCAL_DEV: '1'
          APP_ORIGIN: http://127.0.0.1:8876
          PORT: '8876'
          PUBLIC_DIR: dist/web
        run: |
          target/debug/photocraft-cloud > test-results/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python tests/web/wait_ready.py
          python tests/web/test_api.py
          python tests/web/test_live.py
          python tests/web/test_live_scale.py
          python tests/web/test_live_handoff.py
          PHOTOCRAFT_CLOUD_BIN=target/debug/photocraft-cloud python tests/web/test_security_auth.py
          python tests/web/test_archive_security.py
          python tests/web/test_renderer_startup.py
          python tests/web/test_discovery_browser.py
          # Report the first failed journey immediately instead of losing its
          # traceback to a job timeout. A passing run still executes every case.
          # Exercise deliberately delayed startup/save frames before the long
          # base suite so a readiness regression gets its own early traceback.
          python tests/web/test_workspace_loading.py -f
          python tests/web/test_browser_readiness.py -f
          python tests/web/test_browser.py -f
          python tests/web/test_browser.py
          PHOTOCRAFT_PAINT_CALIBRATION=1 python -m unittest discover -s tests/web -p test_paint_latency.py
          python tests/web/test_live_browser.py
          python tests/web/benchmark_live_collaboration.py --samples 3 --latency-ms 0 50 100 --output test-results/live-paint.json --context 'GitHub shared runner; no owned parallel build; other host contention unknown'
          cargo fetch --locked
          python packaging/web/tofu-package.py test-results/photocraft-tofu.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-cloud-evidence
          path: test-results/
          retention-days: 7
  container-package:
    needs: acceptance
    runs-on: tofu-ci-8-core
    timeout-minutes: 35
    steps:
      # Fresh runner and caller-revision orchestration/tests. Candidate code is
      # executed only inside its image, never as the QA host's Python helper.
      # The first PR adding this gate requires a reviewed trusted-branch bootstrap.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: browser-cloud-evidence
          path: .container-input
      - name: Install contract-test dependencies
        run: python -m pip install -r tests/web/requirements.txt
      - name: Verify the exact packaged Linux container
        env:
          CANDIDATE_SHA: ${{ inputs.source_ref || github.sha }}
        run: |
          python packaging/web/check-container-package.py \
            --execute --candidate "$CANDIDATE_SHA" \
            --package .container-input/photocraft-tofu.zip --fixture .container-input/fixture.pcraft \
            --receipt test-results/container-package.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-package-evidence
          path: test-results/container-*
          retention-days: 7
