# Modified for PhotoCraft Studio: pin privileged release actions to verified immutable commits.
name: Upstream and tested web release
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tested-web-release
  cancel-in-progress: false
jobs:
  prepare:
    # Transfer or public visibility must not activate ancestry-import writes.
    if: vars.PHOTOCRAFT_UPSTREAM_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      needed: ${{ steps.candidate.outputs.needed }}
      base: ${{ steps.candidate.outputs.base }}
      candidate: ${{ steps.candidate.outputs.candidate }}
      upstream: ${{ steps.candidate.outputs.upstream }}
      branch: ${{ steps.candidate.outputs.branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install verified publication scanner
        run: python3 packaging/web/install-gitleaks.py --destination "$RUNNER_TEMP/gitleaks-bin"
      - name: Expose verified publication scanner
        run: printf '%s\n' "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Merge upstream into an isolated candidate
        id: candidate
        env:
          CANDIDATE_BRANCH: automation/upstream-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name 'PhotoCraft update bot'
          git config user.email 'photocraft-update@users.noreply.github.com'
          python3 packaging/web/upstream-release.py prepare --branch "$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
  native:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.prepare.outputs.candidate }}
  browser:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    uses: ./.github/workflows/web-cloud.yml
    with:
      source_ref: ${{ needs.prepare.outputs.candidate }}
  promote:
    needs: [prepare, native, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Promotion code comes from the trusted workflow revision, never from the candidate.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install verified publication scanner
        run: python3 packaging/web/install-gitleaks.py --destination "$RUNNER_TEMP/gitleaks-bin"
      - name: Expose verified publication scanner
        run: printf '%s\n' "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: browser-cloud-evidence
          path: /tmp/photocraft-acceptance
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: container-package-evidence
          path: /tmp/photocraft-acceptance
      - name: Promote the exact tested source and prebuilt web app
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          git config user.name 'PhotoCraft update bot'
          git config user.email 'photocraft-update@users.noreply.github.com'
          python3 packaging/web/check-container-package.py --verify-receipt \
            --candidate "$CANDIDATE_SHA" --package /tmp/photocraft-acceptance/photocraft-tofu.zip \
            --receipt /tmp/photocraft-acceptance/container-package.json --fixture /tmp/photocraft-acceptance/fixture.pcraft
          python3 packaging/web/upstream-release.py promote \
            --base "$BASE_SHA" --candidate "$CANDIDATE_SHA" --upstream "$UPSTREAM_SHA" \
            --branch "$CANDIDATE_BRANCH" --package /tmp/photocraft-acceptance/photocraft-tofu.zip
          echo 'Native, browser and exact-package container acceptance passed. tofu-release now contains the tested package.' >> "$GITHUB_STEP_SUMMARY"
