<!-- Modified by the independent FZ2000 PhotoCraft Studio fork; see docs/fork-code-map.md. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>PhotoCraft</title>
  <link data-trunk rel="rust" data-bin="photocraft-web" data-cargo-profile="wasm-release" data-cargo-features="heif" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #faf9f7; }
    #photocraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #photocraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center;
      color: #736e7c; font: 14px system-ui, sans-serif; pointer-events: none; text-align: center; padding: 28px; }
    #photocraft_loading img { width: 56px; height: 56px; }
    #photocraft_loading strong { color: #23202d; font-size: 26px; letter-spacing: -1px; }
    #photocraft_loading small { max-width: 310px; line-height: 1.6; }
    #tofu_credit { position: fixed; z-index: 2; right: 8px; bottom: 5px; padding: 1px 5px;
      color: #bcb9d8; background: #1a1a1c; font: 11px system-ui, sans-serif; border-radius: 3px; }
    #photocraft_stalled { visibility: hidden; animation: photocraft-stalled 0s 20s forwards; }
    #photocraft_stalled a { pointer-events: auto; color: #6f45ce; }
    #photocraft_loading.photocraft-startup-error { box-sizing: border-box; pointer-events: auto; overflow: auto; }
    #photocraft_loading.photocraft-startup-error p { margin: 0; max-width: 440px; line-height: 1.6; }
    #photocraft_loading.photocraft-startup-error > a { display: inline-flex; align-items: center; justify-content: center;
      box-sizing: border-box; min-height: 40px; padding: 10px 16px; border-radius: 8px; background: #23202d;
      color: #fff; font-weight: 600; text-decoration: none; }
    #photocraft_loading.photocraft-startup-error > a:hover { background: #393344; }
    #photocraft_loading.photocraft-startup-error :is(a, summary):focus-visible { outline: 3px solid #7955dc; outline-offset: 3px; }
    #photocraft_loading.photocraft-startup-error details { width: min(100%, 640px); text-align: left; }
    #photocraft_loading.photocraft-startup-error summary { width: fit-content; margin: 0 auto; padding: 10px 4px; cursor: pointer; }
    #photocraft_loading.photocraft-startup-error pre { box-sizing: border-box; max-height: 160px; overflow: auto;
      margin: 8px 0 0; padding: 12px; border: 1px solid #d9d5e0; border-radius: 8px; font: 12px/1.5 monospace;
      white-space: pre-wrap; overflow-wrap: anywhere; }
    @keyframes photocraft-stalled { to { visibility: visible; } }
  </style>
</head>
<body>
  <canvas id="photocraft_canvas" aria-label="PhotoCraft Studio creative workspace"></canvas>
  <div id="photocraft_loading" role="status"><strong>PhotoCraft Studio</strong><span>A little space for your next great idea.</span><small>Opening your workspace&hellip;<br>The first visit takes a moment to load the editor.</small><p id="photocraft_stalled">The editor may have failed to download. <a href="">Reload</a> to try again.</p></div>
  <noscript>PhotoCraft Studio needs JavaScript and WebAssembly enabled to run the Rust editor in your browser.</noscript>
  <a id="tofu_credit" href="https://trytofu.ai" target="_blank" rel="noopener noreferrer">Hosted on Tofu</a>
</body>
</html>
